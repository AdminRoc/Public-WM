  <header class="bw-header">

      <a href="/" class="bw-htab bw-brand" title="返回主页"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span>

        <div class="bw-brand-text">
          <span class="bw-brand-cn">CSC·Alliance</span>
          <span class="bw-brand-sub">PUBLIC <span class="bw-brand-wm">WM</span></span>
        </div>

      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="https://world.wfspeed.run" target="_blank" rel="noopener" class="bw-htab bw-nav-link"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">世界状态</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="https://eelog.wfspeed.run"      target="_blank" rel="noopener" class="bw-htab bw-nav-link"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">日志分析</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="https://item.wfspeed.run"        target="_blank" rel="noopener" class="bw-htab bw-nav-link"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">来源查询</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="https://relic.wfspeed.run" target="_blank" rel="noopener" class="bw-htab bw-nav-link"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">核桃溯源</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="/quant" class="bw-htab bw-nav-link is-current"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">量化操作</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <a href="/auctions" class="bw-htab bw-nav-link"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">拍卖功能</span></a>
      <span class="bw-nav-slash" aria-hidden="true"></span>
      <button class="bw-htab bw-nav-link" id="bw-logout-btn" title="退出登录"><span class="bw-tab-fill"></span><span class="bw-nav-shine"></span><span class="bw-nav-label">登出账号</span></button>
      <button class="bw-hamburger" id="bw-hamburger" aria-label="导航菜单" aria-expanded="false">
        <span class="bw-tab-fill"></span>
        <span class="bw-hamburger-icon"><span></span><span></span><span></span></span>
      </button>
    </div>
  </header>
  <div class="bw-drawer-overlay" id="bw-drawer-overlay" aria-hidden="true"></div>
  <nav class="bw-drawer" id="bw-drawer" aria-label="移动端导航">
    <div class="bw-drawer-head">
      <img src="/picture/WS-logo-2.png" class="bw-drawer-head-logo" alt="WS">
      <div><span class="bw-drawer-head-cn">CSC·Alliance</span><span class="bw-drawer-head-sub">PUBLIC <span class="bw-brand-wm">WM</span></span></div>
    </div>
    <div class="bw-drawer-nav">
      <a href="/"    class="bw-drawer-link">主页</a>
      <a href="https://world.wfspeed.run" target="_blank" rel="noopener" class="bw-drawer-link">世界状态</a>
      <a href="https://eelog.wfspeed.run"      target="_blank" rel="noopener" class="bw-drawer-link">日志分析</a>
      <a href="https://item.wfspeed.run"        target="_blank" rel="noopener" class="bw-drawer-link">来源查询</a>
      <div class="bw-drawer-sep"></div>
      <a href="https://relic.wfspeed.run" target="_blank" rel="noopener" class="bw-drawer-link">核桃溯源</a>
      <a href="/quant"      class="bw-drawer-link is-current">量化操作</a>
      <a href="/auctions"   class="bw-drawer-link">拍卖功能</a>
    </div>
    <div class="bw-drawer-logout">
      <button class="bw-drawer-logout-btn" id="bw-drawer-logout-btn">登出账号</button>
    </div>
  </nav>

  <div class="bw-confirm-overlay" id="bw-logout-confirm" aria-hidden="true">
    <div class="bw-confirm-box">
      <span class="bw-c bw-c-tl"></span><span class="bw-c bw-c-tr"></span>
      <span class="bw-c bw-c-bl"></span><span class="bw-c bw-c-br"></span>
      <div class="bw-confirm-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div class="bw-confirm-title">确认登出账号？</div>
      <div class="bw-confirm-sub">登出后需重新输入邮箱与口令验证身份</div>
      <div class="bw-confirm-actions">
        <button class="bw-confirm-btn bw-confirm-cancel" id="bw-confirm-cancel">取消</button>
        <button class="bw-confirm-btn bw-confirm-ok" id="bw-confirm-ok">确认登出</button>
      </div>
    </div>
  </div>

  <!-- 通用确认框（批量下架二次确认复用） -->
  <div class="bw-confirm-overlay" id="bw-quant-confirm" aria-hidden="true">
    <div class="bw-confirm-box">
      <span class="bw-c bw-c-tl"></span><span class="bw-c bw-c-tr"></span>
      <span class="bw-c bw-c-bl"></span><span class="bw-c bw-c-br"></span>
      <div class="bw-confirm-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="bw-confirm-title" id="bw-quant-confirm-title">确认操作</div>
      <div class="bw-confirm-sub" id="bw-quant-confirm-sub"></div>
      <div class="bw-confirm-actions">
        <button class="bw-confirm-btn bw-confirm-cancel" id="bw-quant-confirm-cancel">取消</button>
        <button class="bw-confirm-btn bw-confirm-ok" id="bw-quant-confirm-ok">确认</button>
      </div>
    </div>
  </div>

  <div class="bw-wf-bg" aria-hidden="true"><img src="/picture/warframe-logo-blue-black.svg" alt=""></div>

  <main class="page-wrap bw-wrap">
    <section class="bw-tr-panel bw-quant-panel">
      <span class="bw-c bw-c-tl"></span><span class="bw-c bw-c-tr"></span>
      <span class="bw-c bw-c-bl"></span><span class="bw-c bw-c-br"></span>

      <!-- 上架 / 下架 模式切换 -->
      <div class="bw-quant-mode-row">
        <button class="bw-quant-mode-btn active" data-qmode="list">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          批量上架
        </button>
        <button class="bw-quant-mode-btn" data-qmode="delist">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          批量下架
        </button>
        <span class="bw-quant-status" id="bw-quant-status"></span>
      </div>

      <!-- 筛选器 -->
      <div class="bw-quant-filter-row">
        <input class="bw-quant-search" id="bw-quant-search" placeholder="模糊搜索物品名…" autocomplete="off">
        <div class="bw-quant-sort-row">
          <span class="bw-auc-ctrl-label">排序</span>
          <button class="bw-auc-sort-btn active" data-qsort="name_asc">首字母正序</button>
          <button class="bw-auc-sort-btn" data-qsort="name_desc">首字母倒序</button>
          <button class="bw-auc-sort-btn" data-qsort="avg_asc">均价升序</button>
          <button class="bw-auc-sort-btn" data-qsort="avg_desc">均价降序</button>
        </div>
      </div>
      <div class="bw-quant-tagbar" id="bw-quant-tagbar"></div>
    </section>

    <section class="bw-tr-panel bw-quant-panel">
      <div class="bw-inv-section-head">
        <span class="bw-inv-section-title"><span id="bw-quant-mode-label">还未上架的物品</span>（<span id="bw-quant-n">0</span>）</span>
        <label class="bw-quant-selall">
          <input type="checkbox" id="bw-quant-selall-cb">
          <span>全选当前筛选结果</span>
        </label>
      </div>
      <div class="bw-quant-list" id="bw-quant-list">
        <div class="bw-inv-empty">正在加载…</div>
      </div>

      <!-- 批量上架操作条 -->
      <div class="bw-quant-action-row" id="bw-quant-action-list">
        <div class="bw-batch-item bw-batch-item-accent">
          <div class="bw-quant-price-row">
            <div class="bw-round-pills" id="bw-quant-price-mode-pills" title="选择定价方式">
              <button class="bw-round-pill active" data-pricemode="mult">按均价倍率</button>
              <button class="bw-round-pill" data-pricemode="fixed">按指定价格</button>
            </div>
            <label class="bw-quant-toggle" title="显示/隐藏没有可靠均价的稀缺物品">
              <input type="checkbox" id="bw-quant-show-special">
              <span>显示稀缺</span>
            </label>
          </div>
          <div class="bw-batch-input-row" id="bw-quant-mult-wrap">
            <label class="bw-batch-field-label">均价 ×</label>
            <input type="number" id="bw-quant-mult-input" class="bw-batch-input" placeholder="倍率" min="0.1" step="0.1" value="1">
            <span class="bw-batch-unit">=</span>
          </div>
          <div class="bw-batch-input-row" id="bw-quant-fixed-wrap" style="display:none">
            <label class="bw-batch-field-label">统一价</label>
            <input type="number" id="bw-quant-fixed-input" class="bw-batch-input" placeholder="白金" min="1" step="1" value="1">
            <span class="bw-batch-unit">p</span>
          </div>
          <button class="bw-quant-exec-btn" id="bw-quant-list-btn">
            <span class="bw-quant-exec-sweep"></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>批量上架已选中（<span id="bw-quant-list-sel-n">0</span>）</span>
          </button>
          <div class="bw-round-pills" id="bw-quant-round-pills" title="计算出的目标价再向上取整（例如 32 → 精确到5 得 35 / 精确到10 得 40）">
            <button class="bw-round-pill" data-round="none">精确</button>
            <button class="bw-round-pill" data-round="5">精确到5</button>
            <button class="bw-round-pill" data-round="10">精确到10</button>
          </div>
          <div class="bw-round-pills" id="bw-quant-rank-pills" title="可分级物品（MOD/赋能等）上架时的等级">
            <button class="bw-round-pill active" data-rank="max">满级</button>
            <button class="bw-round-pill" data-rank="0">0级</button>
          </div>
        </div>
        <div class="bw-batch-progress" id="bw-quant-list-progress" style="display:none">
          <div class="bw-batch-bar-wrap"><div class="bw-batch-bar" id="bw-quant-list-bar"></div></div>
          <span class="bw-batch-prog-text" id="bw-quant-list-prog-text">0 / 0</span>
          <button class="bw-batch-abort-btn" id="bw-quant-list-abort-btn" title="中止当前批处理任务">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
            中止
          </button>
        </div>
        <div class="bw-batch-fail" id="bw-quant-list-fail" style="display:none">
          <span class="bw-c bw-c-tl"></span><span class="bw-c bw-c-tr"></span>
          <span class="bw-c bw-c-bl"></span><span class="bw-c bw-c-br"></span>
          <div class="bw-batch-fail-head">
            <span class="bw-batch-fail-title">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L14.5 13H1.5L8 1.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="8" y1="6" x2="8" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r=".8" fill="currentColor"/></svg>
              <strong id="bw-quant-list-fail-n">0</strong> 条操作失败
            </span>
            <div class="bw-batch-fail-actions">
              <button class="bw-batch-fail-btn" id="bw-quant-list-fail-toggle">展开详情</button>
              <button class="bw-batch-fail-btn bw-batch-fail-retry" id="bw-quant-list-fail-retry">一键重试</button>
              <button class="bw-batch-fail-btn bw-batch-fail-close" id="bw-quant-list-fail-close" title="关闭">✕</button>
            </div>
          </div>
          <div class="bw-batch-fail-list" id="bw-quant-list-fail-list" style="display:none"></div>
        </div>
      </div>

      <!-- 批量下架操作条 -->
      <div class="bw-quant-action-row" id="bw-quant-action-delist" style="display:none">
        <div class="bw-batch-item bw-batch-item-accent">
          <label class="bw-batch-field-label">批量下架已选中订单</label>
          <div class="bw-batch-input-row">
            <button class="bw-quant-exec-btn is-danger" id="bw-quant-delist-btn">
              <span class="bw-quant-exec-sweep"></span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>批量下架已选中（<span id="bw-quant-delist-sel-n">0</span>）</span>
            </button>
          </div>
        </div>
        <div class="bw-batch-progress" id="bw-quant-delist-progress" style="display:none">
          <div class="bw-batch-bar-wrap"><div class="bw-batch-bar" id="bw-quant-delist-bar"></div></div>
          <span class="bw-batch-prog-text" id="bw-quant-delist-prog-text">0 / 0</span>
          <button class="bw-batch-abort-btn" id="bw-quant-delist-abort-btn" title="中止当前批处理任务">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
            中止
          </button>
        </div>
        <div class="bw-batch-fail" id="bw-quant-delist-fail" style="display:none">
          <span class="bw-c bw-c-tl"></span><span class="bw-c bw-c-tr"></span>
          <span class="bw-c bw-c-bl"></span><span class="bw-c bw-c-br"></span>
          <div class="bw-batch-fail-head">
            <span class="bw-batch-fail-title">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L14.5 13H1.5L8 1.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="8" y1="6" x2="8" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r=".8" fill="currentColor"/></svg>
              <strong id="bw-quant-delist-fail-n">0</strong> 条操作失败
            </span>
            <div class="bw-batch-fail-actions">
              <button class="bw-batch-fail-btn" id="bw-quant-delist-fail-toggle">展开详情</button>
              <button class="bw-batch-fail-btn bw-batch-fail-retry" id="bw-quant-delist-fail-retry">一键重试</button>
              <button class="bw-batch-fail-btn bw-batch-fail-close" id="bw-quant-delist-fail-close" title="关闭">✕</button>
            </div>
          </div>
          <div class="bw-batch-fail-list" id="bw-quant-delist-fail-list" style="display:none"></div>
        </div>
      </div>
    </section>
  </main>

      </div>

    </div>
  </footer>
