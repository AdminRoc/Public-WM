name: 同步数据到 EdgeOne KV (直写 KV，不经自定义域)

# 将本仓库 data/ 下的最新产物（均价/拍卖字典/物品总表）直写 Makers KV，
# 前端经 market.wfspeed.run/api/kv?key=... 同源读取时边缘函数再 HKDF 解密。
# 仅公库暴露内容反爬，私库不落密文。

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["刷新全量均价数据", "刷新拍卖字典", "刷新物品总表"]
    types: [completed]

concurrency:
  group: sync-kv
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 写入 EdgeOne KV (直写 KV 优先，回退 HTTP)
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
          KV_NAMESPACE: ${{ secrets.KV_NAMESPACE_PUBLIC }}
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          pip install -q tencentcloud-sdk-python cryptography
          if [ -n "${TENCENTCLOUD_SECRET_ID:-}" ] && [ -n "${TENCENTCLOUD_SECRET_KEY:-}" ] && [ -n "${ZONE_ID:-}" ] && [ -n "${KV_NAMESPACE:-}" ]; then
            echo "直写 KV via TencentCloud API"
            for spec in avg_prices_full_json=data/avg_prices_full.json auction_dicts_json=data/auction-dicts.json wm_items_json=data/wm-items.json; do
              key="${spec%%=*}"; file="${spec#*=}";
              test -f "${file}" || { echo "skip $key ($file 不存在)"; continue; }
              python3 .github/scripts/kv_put.py --zone "${ZONE_ID}" --ns "${KV_NAMESPACE}" --key "${key}" --file "${file}"
            done
          elif [ -n "${KV_WRITE_TOKEN:-}" ]; then
            echo "回退 HTTP POST https://market.wfspeed.run/api/update-kv"
            for spec in avg_prices_full_json=data/avg_prices_full.json auction_dicts_json=data/auction-dicts.json wm_items_json=data/wm-items.json; do
              key="${spec%%=*}"; file="${spec#*=}";
              test -f "${file}" || { echo "skip $key ($file 不存在)"; continue; }
              python3 -c 'import json,sys; k,p=sys.argv[1:]; v=open(p,encoding="utf-8").read(); print(json.dumps({"key":k,"value":v},ensure_ascii=False))' "${key}" "${file}" > /tmp/payload.json
              curl --fail --retry 3 --max-time 300 -X POST "https://market.wfspeed.run/api/update-kv" -H "Authorization: Bearer ${KV_WRITE_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json
            done
          else
            echo "Missing KV credentials"; exit 1
          fi
