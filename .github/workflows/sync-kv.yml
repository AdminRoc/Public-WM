name: 发布 Public-WM 指针并同步 Private-WM 兼容数据

# PWM_KV 只保存已验证 SHA 固定 raw 数据集的短指针；旧 API 路径兼容读取器
# 会从该不可变 release 读取并验 hash。Private-WM 的 BWM_KV 暂时保留原有双写，
# 直到 Private-WM 消费端安全完成独立迁移。
# 需要仓库 Secrets：KV_WRITE_TOKEN、BWM_KV_WRITE_TOKEN、BWM_UPDATE_URL、PRICE_DATA_SECRET。

on:
  workflow_dispatch:
  workflow_run:
    # A new item catalog dispatches the average refresh. Publish the new item
    # manifest only after that full refresh succeeds, so KV never pairs it with
    # the previous slug-keyed average artifact.
    workflows: ["刷新全量均价数据", "刷新拍卖字典"]
    types: [completed]

concurrency:
  group: sync-kv
  cancel-in-progress: false

jobs:
  sync_gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      do_sync: ${{ steps.gate.outputs.do_sync }}
    steps:
      - name: Checkout workflow-run guard
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main
          sparse-checkout: |
            .github/scripts
      - name: Require a successful producer job
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 .github/scripts/sync_run_guard.py

  sync:
    permissions:
      contents: write
    needs: sync_gate
    if: needs.sync_gate.outputs.do_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: main

      - name: 安装加密数据回读校验依赖
        run: pip install cryptography -q

      - name: 测试 KV 发布的稳定 ID 连续性保护
        run: python3 -m unittest discover -s tests -p 'test_wm_item_identity.py' -v

      - name: 测试 BWM 商品目录压缩封装与请求体上限
        run: node --test tests/kv_payload.test.mjs

      - name: 发布前核对物品清单与均价覆盖范围
        env:
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, '.github/scripts')
          import crypto_price
          from wm_item_identity import validate_published_manifest_continuity
          items_doc = json.loads(pathlib.Path('data/wm-items.json').read_text(encoding='utf-8'))
          items = items_doc.get('data')
          prices = crypto_price.load_json('data/avg_prices_full.json')
          if not isinstance(items, list) or len(items) < 1500:
              raise SystemExit('current WM item manifest is invalid or incomplete')
          if not isinstance(prices, dict):
              raise SystemExit('average-price artifact is unreadable; refusing KV publication')
          slugs = [str(item.get('slug') or '') for item in items]
          ids = [str(item.get('id') or '') for item in items]
          if any(not slug for slug in slugs) or len(set(slugs)) != len(slugs):
              raise SystemExit('current WM item manifest has missing or duplicate slugs')
          if any(not item_id for item_id in ids) or len(set(ids)) != len(ids):
              raise SystemExit('current WM item manifest has missing or duplicate stable IDs')
          try:
              parent_raw = subprocess.run(
                  ['git', 'show', 'HEAD^:data/wm-items.json'],
                  check=True, capture_output=True, text=True, encoding='utf-8',
              ).stdout
              previous_doc = json.loads(parent_raw)
              renames = validate_published_manifest_continuity(previous_doc, items_doc)
          except (subprocess.CalledProcessError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit(
                  'WM item release does not preserve parent stable identities; refusing KV publication'
              ) from error
          missing = set(slugs) - set(prices)
          if missing:
              raise SystemExit('average-price artifact does not cover the current WM item manifest')
          print(f'Public-WM release preflight passed: {len(slugs)} current items, {len(renames)} stable-ID slug changes, averages complete')
          PY


      - name: Build and commit immutable public release manifest
        run: |
          python3 .github/scripts/build_release_manifest.py
          git add data/release-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: publish immutable WM release manifest"
            git push origin HEAD:main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::Public-WM main advanced before release publication"; exit 1; }

      - name: Update Private-WM compatibility data
        env:
          BWM_KV_WRITE_TOKEN: ${{ secrets.BWM_KV_WRITE_TOKEN }}
          BWM_UPDATE_URL: ${{ secrets.BWM_UPDATE_URL }}
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BWM_KV_WRITE_TOKEN}" ] && [ -z "${BWM_UPDATE_URL}" ]; then
            echo "BWM compatibility write is not configured; keeping its existing KV values untouched"
            exit 0
          fi
          test -n "${BWM_KV_WRITE_TOKEN}" || { echo "::error::Missing BWM_KV_WRITE_TOKEN"; exit 1; }
          test -n "${BWM_UPDATE_URL}" || { echo "::error::Missing BWM_UPDATE_URL"; exit 1; }
          endpoint_ok=$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          try:
              endpoint = urlsplit(os.environ.get('BWM_UPDATE_URL', ''))
              ok = endpoint.scheme == 'https' and endpoint.hostname == 'boss.wfspeed.run' and endpoint.path.rstrip('/') == '/api/update-kv'
          except ValueError:
              ok = False
          print('true' if ok else 'false')
          PY
          )
          test "$endpoint_ok" = "true" || { echo "::error::BWM endpoint route check failed"; exit 1; }

          verify_readback() {
            local key="$1" src="$2" expected body code
            expected=$(sha256sum "$src" | awk '{print $1}')
            body="/tmp/${key}-bwm-readback.json"
            code=$(curl -sS -o "$body" -w "%{http_code}" --connect-timeout 20 --max-time 60 \
              -H "Authorization: Bearer ${BWM_KV_WRITE_TOKEN}" \
              "https://boss.wfspeed.run/api/kv?key=${key}&verify=${expected}" || true)
            if [ "$code" != "200" ]; then
              echo "$key BWM compatibility readback HTTP $code" >&2
              if [ "$code" = "404" ]; then return 1; fi
              return 2
            fi
            if ! python3 - "$key" "$src" "$body" <<'PY'
          import json, pathlib, sys
          key, source, readback = sys.argv[1:]
          expected_raw = json.loads(pathlib.Path(source).read_text(encoding='utf-8'))
          actual = json.loads(pathlib.Path(readback).read_text(encoding='utf-8'))
          candidates = [expected_raw]
          if key == 'avg_prices_full_json' and isinstance(expected_raw, dict) and expected_raw.get('ct'):
              sys.path.insert(0, '.github/scripts')
              import crypto_price
              expected_plain = crypto_price.load_json(source)
              if expected_plain is not None:
                  candidates.append(expected_plain)
          if not any(actual == candidate for candidate in candidates):
              raise SystemExit('BWM compatibility value mismatch')
          PY
            then
              return 1
            fi
            echo "$key BWM compatibility readback verified"
            rm -f "$body"
          }

          declare -A FILES=(
            ["avg_prices_full_json"]="data/avg_prices_full.json"
            ["auction_dicts_json"]="data/auction-dicts.json"
            ["wm_items_json"]="data/wm-items.json"
          )
          for key in avg_prices_full_json auction_dicts_json wm_items_json; do
            src="${FILES[$key]}"
            test -f "$src" || { echo "::error::Missing BWM source $src"; exit 1; }
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$src"
          done

          for key in avg_prices_full_json auction_dicts_json wm_items_json; do
            src="${FILES[$key]}"
            if [ "$key" = "wm_items_json" ] && verify_readback "$key" "$src"; then
              echo "BWM wm_items_json already matches source; skipped redundant write"
              continue
            fi
            payload="/tmp/${key}-bwm-payload.json"
            if [ "$key" = "wm_items_json" ]; then
              node .github/scripts/kv_payload.mjs --key "$key" --source "$src" --output "$payload"
            else
              python3 - "$key" "$src" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, output = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          pathlib.Path(output).write_text(json.dumps({'key': key, 'value': value}, separators=(',', ':')), encoding='utf-8')
          PY
            fi
            code=""
            response="/tmp/${key}-bwm-response.txt"
            verified_current=false
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o "$response" -w "%{http_code}" --connect-timeout 20 --max-time 60 \
                -X POST "${BWM_UPDATE_URL}" \
                -H "Authorization: Bearer ${BWM_KV_WRITE_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary "@${payload}" || true)
              if [ "$code" = "200" ]; then break; fi
              echo "BWM compatibility write returned HTTP $code; checking fresh readback before any retry"
              if verify_readback "$key" "$src"; then
                echo "$key BWM compatibility value is already current; skipped replay"
                code="200"
                verified_current=true
                break
              else
                readback_status=$?
              fi
              if [ "$readback_status" -ne 1 ]; then
                echo "::error::BWM write outcome is uncertain and readback unavailable; refusing replay for $key"
                exit 1
              fi
              case "$code" in
                400|401|403|404|405|413|422)
                  echo "BWM returned non-retryable HTTP $code for $key" >&2
                  break
                  ;;
              esac
              echo "BWM compatibility write attempt $attempt returned HTTP $code"
              if [ "$attempt" -lt 8 ]; then sleep 20; fi
            done
            if [ "$code" != "200" ]; then
              echo "::error::BWM compatibility write failed for $key (HTTP $code)"
              exit 1
            fi
            if [ "$verified_current" != true ]; then
              verify_readback "$key" "$src"
            fi
            rm -f "$payload" "$response"
          done

      - name: Publish and verify the small PWM release pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 .github/scripts/publish_release_pointer.py
