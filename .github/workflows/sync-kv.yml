name: 同步数据到 EdgeOne KV (直写 KV，不经自定义域)

# 将本仓库 data/ 下的最新产物（均价/拍卖字典/物品总表）直写 Makers KV，
# 前端经 market.wfspeed.run/api/kv?key=... 同源读取时边缘函数再 HKDF 解密。
# 仅公库暴露内容反爬，私库不落密文。

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["刷新全量均价数据", "刷新拍卖字典", "刷新物品总表"]
    types: [completed]

concurrency:
  group: sync-kv
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 拉取私库 kv_put 真源
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖 kv_put 到工作树
        run: cp _private/.github/scripts/kv_put.py .github/scripts/kv_put.py

      - name: 写入 EdgeOne KV (直写，不经 /api/update-kv)
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
          KV_NAMESPACE: ${{ secrets.KV_NAMESPACE_PUBLIC }}
        run: |
          set -euo pipefail
          test -n "${TENCENTCLOUD_SECRET_ID}" || { echo 'Missing TENCENTCLOUD_SECRET_ID'; exit 1; }
          test -n "${TENCENTCLOUD_SECRET_KEY}" || { echo 'Missing TENCENTCLOUD_SECRET_KEY'; exit 1; }
          test -n "${ZONE_ID}" || { echo 'Missing ZONE_ID'; exit 1; }
          test -n "${KV_NAMESPACE}" || { echo 'Missing KV_NAMESPACE_PUBLIC'; exit 1; }
          pip install -q tencentcloud-sdk-python cryptography
          for spec in avg_prices_full_json=data/avg_prices_full.json auction_dicts_json=data/auction-dicts.json wm_items_json=data/wm-items.json; do
            key="${spec%%=*}"; file="${spec#*=}";
            test -f "${file}" || { echo "skip $key ($file 不存在)"; continue; }
            # 仅公库暴露内容（已加密包装，直接 put 密文）；>1MB 仅 cdn，已在产线控制
            python3 .github/scripts/kv_put.py --zone "${ZONE_ID}" --ns "${KV_NAMESPACE}" --key "${key}" --file "${file}"
          done
