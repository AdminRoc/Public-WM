name: 刷新物品总表

# 拉取 WM 全量可交易物品总表，精简为前端所需字段，产出 data/wm-items.json。
# 脚本：.github/scripts/harvest_wm_items.py（无需额外依赖）。
# 产物提交到 main 后，首页经 jsDelivr 引用：
#   https://cdn.jsdelivr.net/gh/AdminRoc/Public-WM@main/data/wm-items.json
# 前端直接加载，边缘函数不再拉取大体积表。频率提至每2小时（原每日一次过稀）。

on:
  workflow_dispatch:
    inputs:
      cf_schedule_fallback:
        description: Mark as the hourly Cloudflare schedule fallback
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '11 */2 * * *'  # 错开整点调度高峰，仍每2小时刷新

concurrency:
  group: harvest-wm-items
  cancel-in-progress: false

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_capture: ${{ steps.guard.outputs.run_capture }}
    steps:
      - name: Checkout catalog freshness guard
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - name: Gate periodic catalog fetches on last complete harvest
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          CF_SCHEDULE_FALLBACK: ${{ github.event.inputs.cf_schedule_fallback }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          MIN_AGE_MINUTES: "110"
        run: python3 .github/scripts/wm_items_schedule_guard.py

  harvest:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_capture == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 测试 item ID 连续性与 slug alias
        run: python3 -m unittest discover -s tests -p 'test_wm_item_identity.py' -v

      - name: 拉取物品总表
        run: python3 .github/scripts/harvest_wm_items.py
        env:
          WM_ITEMS_OUT: data/wm-items.json
          WM_IDENTITIES_OUT: data/wm-item-identities.json

      - name: 提交并推送
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wm-items.json data/wm-item-identities.json
          if git diff --staged --quiet; then
            echo "无变动，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh wm-items.json [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git pull --rebase origin main; then
              echo "无法在远端更新后安全重放物品产物" >&2
              exit 1
            fi
            sleep "$(( (RANDOM % 4) + 2 ))"
          done
          exit 1

      # jsDelivr @main 缓存延迟，提交后主动 purge 立即回源最新产物。
      - name: 刷新 jsDelivr 缓存（物品总表）
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/AdminRoc/Public-WM@main/data/wm-items.json" || true
          curl -s "https://purge.jsdelivr.net/gh/AdminRoc/Public-WM@main/data/wm-item-identities.json" || true

      - name: 新物品版本触发均价与 PWM/BWM 发布
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/refresh-avg-prices.yml --repo AdminRoc/Public-WM --ref main
